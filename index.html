<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéClone TCG WebApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --type-grass: #4ade80;
            --type-fire: #f87171;
            --type-water: #60a5fa;
            --type-electric: #facc15;
            --type-psychic: #c084fc;
            --type-normal: #94a3b8;
        }
        body { 
            font-family: 'Noto Sans JP', sans-serif; 
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            color: white; 
            overflow: hidden; /* 防止全体のスクロール */
            touch-action: manipulation;
        }
        .font-poppins { font-family: 'Poppins', sans-serif; }

        .card-container { perspective: 1000px; }
        .tcg-card {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            transform-style: preserve-3d;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
            border: 5px solid #cbd5e1;
            background-color: #f8fafc;
            color: #0f172a;
        }
        .tcg-card:hover { box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6); }
        .tcg-card.selected {
            transform: translateY(-15px) scale(1.05);
            border-color: #fbbf24;
            box-shadow: 0 0 15px 5px rgba(251, 191, 36, 0.4);
            z-index: 50;
        }
        
        .hand-container { display: flex; justify-content: center; gap: -2rem; padding: 1rem 0; overflow-x: auto; scrollbar-width: none; }
        .hand-container::-webkit-scrollbar { display: none; }
        .hand-item { margin-left: -30px; transition: 0.3s; z-index: 1; cursor: pointer; }
        .hand-item:first-child { margin-left: 0; }
        .hand-item:hover { z-index: 10; transform: translateY(-20px) rotate(-2deg); }

        .slot { 
            border: 3px dashed rgba(255,255,255,0.2); 
            background: rgba(0,0,0,0.2); 
            border-radius: 0.75rem; 
            display: flex; align-items: center; justify-content: center; 
            transition: all 0.2s;
        }
        .slot.droppable:hover { border-color: #fbbf24; background: rgba(251, 191, 36, 0.1); cursor: pointer; }

        @keyframes attackTackle {
            0% { transform: translateY(0); }
            50% { transform: translateY(-30px) scale(1.1); }
            100% { transform: translateY(0); }
        }
        .anim-attack { animation: attackTackle 0.4s ease-in-out; }

        /* Toast */
        @keyframes slideInUp { from { transform: translate(-50%, 100%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        .toast { animation: slideInUp 0.3s ease-out forwards; left: 50%; transform: translateX(-50%); }
    </style>
</head>
<body class="h-screen w-screen flex flex-col">

    <header class="bg-slate-900/80 backdrop-blur-md shadow-lg p-3 flex justify-between items-center border-b border-slate-700 z-50">
        <h1 class="text-2xl font-poppins font-black italic text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-red-500 to-pink-500 tracking-wider">
            POKÉCLONE <span class="text-sm font-normal text-slate-300 not-italic">TCG</span>
        </h1>
        <div id="auth-section" class="flex items-center gap-3">
            <span id="user-name" class="hidden text-sm font-bold text-slate-200 bg-slate-800 px-3 py-1 rounded-full border border-slate-600"></span>
            <button id="btn-login" class="bg-white text-slate-900 font-bold py-1.5 px-4 rounded shadow-md hover:bg-slate-200 transition flex items-center gap-2 text-sm">
                <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="currentColor" d="M21.35,11.1H12.18V13.83H18.69C18.36,17.64 15.19,19.27 12.19,19.27C8.36,19.27 5,16.25 5,12C5,7.9 8.2,4.73 12.2,4.73C15.29,4.73 17.1,6.7 17.1,6.7L19,4.72C19,4.72 16.56,2 12.1,2C6.42,2 2.03,6.8 2.03,12C2.03,17.05 6.16,22 12.25,22C17.6,22 21.5,18.33 21.5,12.91C21.5,11.76 21.35,11.1 21.35,11.1V11.1Z"/></svg>
                Googleログイン
            </button>
            <button id="btn-logout" class="hidden bg-red-500/20 text-red-400 border border-red-500/50 hover:bg-red-500 hover:text-white font-bold py-1.5 px-3 rounded transition text-sm">
                ログアウト
            </button>
        </div>
    </header>

    <main class="flex-1 flex flex-col relative w-full max-w-6xl mx-auto overflow-hidden">
        
        <!-- Login Overlay -->
        <div id="login-overlay" class="absolute inset-0 z-40 bg-slate-900/90 backdrop-blur-sm flex flex-col items-center justify-center">
            <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700 text-center max-w-md w-full mx-4">
                <div class="w-20 h-20 bg-gradient-to-tr from-yellow-400 to-red-500 rounded-full mx-auto mb-6 shadow-lg flex items-center justify-center">
                    <span class="text-4xl">⚡</span>
                </div>
                <h2 class="text-2xl font-bold mb-2">PokéCloneへようこそ</h2>
                <p class="text-slate-400 mb-6 text-sm">遊ぶにはGoogleアカウントでログインしてください。進行状況はクラウドに自動保存されます。</p>
                <p class="text-xs text-slate-500">※GitHub Pages対応版</p>
            </div>
        </div>

        <div class="h-1/4 min-h-[150px] bg-slate-800/50 border-b border-slate-700 flex flex-col justify-between p-4 opacity-70">
            <div class="flex justify-between items-start">
                <div class="flex gap-2" id="opp-bench">
                    <div class="w-16 h-24 bg-slate-700 rounded border border-slate-600 shadow-inner"></div>
                    <div class="w-16 h-24 bg-slate-700 rounded border border-slate-600 shadow-inner"></div>
                    <div class="w-16 h-24 bg-slate-700 rounded border border-slate-600 shadow-inner"></div>
                </div>
                <div class="text-right">
                    <p class="text-xs font-bold text-slate-400 tracking-widest">OPPONENT</p>
                </div>
            </div>
            <div class="flex justify-center">
                <div class="w-20 h-28 bg-slate-700 rounded border-2 border-slate-600 shadow-inner flex items-center justify-center">
                    <span class="text-slate-500 text-xs font-bold">ACTIVE</span>
                </div>
            </div>
        </div>

        <div class="flex-1 flex flex-col p-4 justify-between bg-cover bg-center" style="background-image: radial-gradient(circle at center, rgba(30,41,59,0) 0%, rgba(15,23,42,0.8) 100%);">
            
            <!-- Player Active & Deck Area -->
            <div class="flex justify-between items-center w-full mt-2">
                
                <!-- Reset Game Button -->
                <div class="w-24">
                    <button onclick="resetGame()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 py-2 px-3 rounded border border-slate-600 transition shadow-sm">
                        🔄 リセット
                    </button>
                </div>

                <!-- Active Slot -->
                <div class="flex flex-col items-center">
                    <div id="active-slot" class="slot droppable w-32 h-48 relative" onclick="playToSlot('active')">
                        <span class="text-slate-400 text-sm font-bold pointer-events-none">バトル場</span>
                    </div>
                    <button id="btn-attack" onclick="attack()" class="mt-3 hidden bg-gradient-to-r from-red-500 to-orange-500 hover:from-red-400 hover:to-orange-400 text-white font-bold py-1.5 px-6 rounded-full shadow-lg transform transition active:scale-95 border-2 border-red-300">
                        ⚔️ 攻撃する！
                    </button>
                </div>

                <!-- Deck Area -->
                <div class="w-24 flex flex-col items-end">
                    <p class="text-xs text-slate-400 mb-1 font-bold">山札: <span id="deck-count" class="text-white">0</span>枚</p>
                    <div onclick="drawCard()" class="w-24 h-36 bg-blue-700 rounded-xl border-4 border-blue-400 shadow-[0_8px_0_#1e3a8a] hover:translate-y-1 hover:shadow-[0_4px_0_#1e3a8a] flex items-center justify-center cursor-pointer transition-all active:translate-y-2 active:shadow-none group relative">
                        <div class="w-16 h-16 rounded-full border-4 border-blue-400 flex items-center justify-center opacity-50 group-hover:opacity-100 transition">
                            <span class="text-blue-200 font-black text-2xl">P</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-6 flex flex-col">
                <p class="text-xs text-slate-400 mb-1 font-bold px-2">ベンチ (最大5匹)</p>
                <div class="flex gap-2 px-2" id="bench-slots">
                    <!-- JS will populate bench -->
                </div>
            </div>
        </div>

        <div class="h-[180px] bg-slate-900/90 border-t border-slate-700 p-2 flex flex-col justify-end relative shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
            <div class="absolute top-2 left-4">
                <span class="text-xs font-bold text-slate-400 bg-slate-800 px-2 py-1 rounded">手札: <span id="hand-count" class="text-white">0</span>枚</span>
            </div>
            <div id="player-hand" class="hand-container w-full h-full items-end pb-2">
                <!-- Cards injected here -->
            </div>
        </div>
    </main>

    <!-- Custom Toast -->
    <div id="toast-container" class="fixed bottom-24 z-[100] w-full pointer-events-none"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Config (User Provided)
        const firebaseConfig = {
            apiKey: "AIzaSyBEwJfxABiedxcpMUVZHEjh3hCoMi1ypoA",
            authDomain: "task-e184e.firebaseapp.com",
            projectId: "task-e184e",
            storageBucket: "task-e184e.firebasestorage.app",
            messagingSenderId: "978971119576",
            appId: "1:978971119576:web:81a93c0b081b2b47f22cad"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const APP_ID = 'pokeclone'; // For strict path rule

        const TYPE_COLORS = {
            '🍃': 'bg-green-400 border-green-600',
            '🔥': 'bg-red-400 border-red-600',
            '💧': 'bg-blue-400 border-blue-600',
            '⚡': 'bg-yellow-400 border-yellow-600',
            '🔮': 'bg-purple-400 border-purple-600',
            '⚪': 'bg-slate-300 border-slate-500'
        };

        const CARD_DB = [
            { id: 1, name: 'ピカチュウ', hp: 60, type: '⚡', attack: '10まんボルト', dmg: 30, flavor: 'でんきネズミ' },
            { id: 2, name: 'ヒトカゲ', hp: 50, type: '🔥', attack: 'ひのこ', dmg: 20, flavor: 'とかげポケモン' },
            { id: 3, name: 'フシギダネ', hp: 70, type: '🍃', attack: 'つるのムチ', dmg: 20, flavor: 'たねポケモン' },
            { id: 4, name: 'ゼニガメ', hp: 60, type: '💧', attack: 'みずでっぽう', dmg: 20, flavor: 'かめのこポケモン' },
            { id: 5, name: 'ミュウツー', hp: 130, type: '🔮', attack: 'サイコキネシス', dmg: 60, flavor: 'いでんしポケモン' },
            { id: 6, name: 'イーブイ', hp: 50, type: '⚪', attack: 'たいあたり', dmg: 10, flavor: 'しんかポケモン' },
            { id: 7, name: 'リザードン', hp: 150, type: '🔥', attack: 'だいもんじ', dmg: 90, flavor: 'かえんポケモン' },
            { id: 8, name: 'カメックス', hp: 150, type: '💧', attack: 'ハイドロポンプ', dmg: 80, flavor: 'こうらポケモン' },
        ];

        let state = {
            deck: [],
            hand: [],
            active: null,
            bench: [null, null, null, null, null],
            selectedIndex: null
        };
        let currentUser = null;

        // UI Elements
        const DOM = {
            loginOverlay: document.getElementById('login-overlay'),
            btnLogin: document.getElementById('btn-login'),
            btnLogout: document.getElementById('btn-logout'),
            userName: document.getElementById('user-name'),
            hand: document.getElementById('player-hand'),
            activeSlot: document.getElementById('active-slot'),
            benchSlots: document.getElementById('bench-slots'),
            deckCount: document.getElementById('deck-count'),
            handCount: document.getElementById('hand-count'),
            btnAttack: document.getElementById('btn-attack'),
            toastContainer: document.getElementById('toast-container')
        };

        window.showToast = (msg, isError = false) => {
            const el = document.createElement('div');
            el.className = `toast inline-block px-6 py-3 rounded-full shadow-2xl text-sm font-bold border-2 
                            ${isError ? 'bg-red-900 border-red-500 text-red-100' : 'bg-slate-800 border-slate-600 text-white'}`;
            el.innerText = msg;
            DOM.toastContainer.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translate(-50%, 10px)';
                setTimeout(() => el.remove(), 300);
            }, 2500);
        };

        const createUUID = () => {
            return typeof crypto.randomUUID === 'function' ? crypto.randomUUID() : Math.random().toString(36).substring(2);
        };

        const handleAuth = async () => {
            // カスタムFirebaseプロジェクトを使用するため、環境固有の自動ログイン用トークン(__initial_auth_token)の処理を削除しました。
            
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    currentUser = user;
                    DOM.loginOverlay.classList.add('hidden');
                    DOM.btnLogin.classList.add('hidden');
                    DOM.btnLogout.classList.remove('hidden');
                    DOM.userName.innerText = user.displayName || 'Player';
                    DOM.userName.classList.remove('hidden');
                    await loadData();
                } else {
                    currentUser = null;
                    DOM.loginOverlay.classList.remove('hidden');
                    DOM.btnLogin.classList.remove('hidden');
                    DOM.btnLogout.classList.add('hidden');
                    DOM.userName.classList.add('hidden');
                }
            });
        };

        DOM.btnLogin.addEventListener('click', async () => {
            try { await signInWithPopup(auth, provider); } 
            catch (error) { showToast("ログイン失敗: " + error.message, true); }
        });

        DOM.btnLogout.addEventListener('click', () => {
            signOut(auth);
            state = { deck: [], hand: [], active: null, bench: [null, null, null, null, null], selectedIndex: null };
            render();
        });

        const getDocRef = () => {
            if (!currentUser) return null;
            // RULE 1: Strict paths /artifacts/{appId}/users/{userId}/{collectionName}
            return doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'gamestate', 'current');
        };

        const loadData = async () => {
            const ref = getDocRef();
            if (!ref) return;
            try {
                const snap = await getDoc(ref);
                if (snap.exists()) {
                    state = snap.data();
                    // Reset selection state on load
                    state.selectedIndex = null; 
                    showToast("ゲームデータを復元しました");
                } else {
                    window.resetGame(false); // Init new game without showing reset toast
                }
                render();
            } catch (error) {
                console.error("DB Load Error:", error);
                showToast("データ読み込みに失敗", true);
            }
        };

        const saveData = async () => {
            const ref = getDocRef();
            if (!ref) return;
            try {
                // Remove UI specific state before saving
                const dataToSave = { ...state, selectedIndex: null };
                await setDoc(ref, dataToSave);
            } catch (error) {
                console.error("DB Save Error:", error);
            }
        };

        window.resetGame = (showMsg = true) => {
            let newDeck = [];
            for (let i = 0; i < 30; i++) {
                const baseCard = CARD_DB[Math.floor(Math.random() * CARD_DB.length)];
                newDeck.push({ ...baseCard, uid: createUUID() });
            }
            
            state.deck = newDeck;
            state.hand = [];
            state.active = null;
            state.bench = [null, null, null, null, null];
            state.selectedIndex = null;

            // Draw 5 initial cards
            for(let i=0; i<5; i++) processDraw(false);
            
            if(showMsg) showToast("ゲームをリセットしました");
            saveData();
            render();
        };

        window.drawCard = () => {
            processDraw(true);
        };

        const processDraw = (triggerSaveAndRender) => {
            if (state.deck.length === 0) {
                if(triggerSaveAndRender) showToast("山札がありません！", true);
                return;
            }
            if (state.hand.length >= 7) {
                if(triggerSaveAndRender) showToast("手札は7枚までです", true);
                return;
            }
            state.hand.push(state.deck.pop());
            if (triggerSaveAndRender) {
                saveData();
                render();
            }
        };

        window.selectCard = (index) => {
            if (state.selectedIndex === index) {
                state.selectedIndex = null; // Deselect
            } else {
                state.selectedIndex = index; // Select
            }
            render();
        };

        window.playToSlot = (type, benchIndex = 0) => {
            if (state.selectedIndex === null) return;
            const card = state.hand[state.selectedIndex];

            if (type === 'active') {
                if (state.active) {
                    showToast("バトル場には既にポケモンがいます", true);
                    return;
                }
                state.active = card;
                showToast(`${card.name} をバトル場に出した！`);
            } else if (type === 'bench') {
                if (state.bench[benchIndex]) {
                    showToast("そのベンチは埋まっています", true);
                    return;
                }
                state.bench[benchIndex] = card;
            }

            state.hand.splice(state.selectedIndex, 1);
            state.selectedIndex = null;
            saveData();
            render();
        };

        window.attack = () => {
            if (!state.active) return;
            
            // Visual feedback
            const cardEl = document.getElementById('active-card-el');
            if (cardEl) {
                cardEl.classList.remove('anim-attack');
                void cardEl.offsetWidth; // trigger reflow
                cardEl.classList.add('anim-attack');
            }
            
            showToast(`${state.active.name} の ${state.active.attack}！ ${state.active.dmg}ダメージ！`);
        };

        const createCardHTML = (card, isSelected = false, onClick = "", extraId = "") => {
            if (!card) return '';
            const colorClass = TYPE_COLORS[card.type] || TYPE_COLORS['⚪'];
            const selClass = isSelected ? 'selected' : '';
            return `
                <div id="${extraId}" onclick="${onClick}" class="tcg-card w-28 h-40 sm:w-32 sm:h-44 rounded-xl flex flex-col p-1.5 select-none ${selClass} relative bg-white">
                    <div class="flex justify-between items-center px-1 mb-1 border-b border-slate-200 pb-1">
                        <span class="text-[10px] sm:text-xs font-black truncate max-w-[65%]">${card.name}</span>
                        <span class="text-[10px] sm:text-xs font-bold text-red-600 whitespace-nowrap">HP ${card.hp}</span>
                    </div>
                    <div class="${colorClass} flex-1 w-full rounded flex flex-col items-center justify-center shadow-inner relative overflow-hidden">
                        <span class="text-4xl absolute opacity-20">${card.type}</span>
                        <span class="text-2xl z-10 drop-shadow-md">${card.type}</span>
                    </div>
                    <div class="mt-1 flex flex-col px-1 h-1/3 justify-end pb-1">
                        <p class="text-[8px] text-slate-500 italic mb-auto truncate">${card.flavor}</p>
                        <div class="flex justify-between items-end">
                            <span class="text-[10px] sm:text-xs font-bold leading-tight">${card.attack}</span>
                            <span class="text-[10px] sm:text-xs font-black">${card.dmg}</span>
                        </div>
                    </div>
                </div>
            `;
        };

        const render = () => {
            // Hand
            DOM.hand.innerHTML = '';
            state.hand.forEach((card, i) => {
                const wrap = document.createElement('div');
                wrap.className = 'hand-item';
                wrap.innerHTML = createCardHTML(card, state.selectedIndex === i, `selectCard(${i})`);
                DOM.hand.appendChild(wrap);
            });

            // Active
            if (state.active) {
                DOM.activeSlot.innerHTML = createCardHTML(state.active, false, "", "active-card-el");
                DOM.activeSlot.classList.remove('droppable');
                DOM.btnAttack.classList.remove('hidden');
            } else {
                DOM.activeSlot.innerHTML = `<span class="text-slate-400 text-sm font-bold pointer-events-none">バトル場</span>`;
                DOM.activeSlot.classList.add('droppable');
                DOM.btnAttack.classList.add('hidden');
            }

            // Bench
            DOM.benchSlots.innerHTML = '';
            state.bench.forEach((card, i) => {
                const slot = document.createElement('div');
                slot.className = `slot w-20 h-28 sm:w-24 sm:h-32 transform scale-95 transition-transform ${!card && state.selectedIndex !== null ? 'droppable' : ''}`;
                slot.onclick = () => playToSlot('bench', i);
                
                if (card) {
                    slot.innerHTML = createCardHTML(card, false);
                    slot.classList.remove('droppable');
                } else {
                    slot.innerHTML = `<span class="text-xs text-slate-600 font-bold pointer-events-none">ベンチ</span>`;
                }
                DOM.benchSlots.appendChild(slot);
            });

            // Counters
            DOM.deckCount.innerText = state.deck.length;
            DOM.handCount.innerText = state.hand.length;
        };

        // Init App
        handleAuth();

    </script>
</body>
</html>
