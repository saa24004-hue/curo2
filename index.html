<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéClone Card Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1a202c; color: white; overflow-x: hidden; }
        .card { transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); }
        .hand-container { display: flex; justify-content: center; gap: -20px; overflow-x: auto; padding-bottom: 10px; }
        .hand-card { margin-left: -30px; transition: 0.3s; z-index: 1; }
        .hand-card:first-child { margin-left: 0; }
        .hand-card:hover { z-index: 10; transform: translateY(-15px) scale(1.05); }
        .slot { border: 2px dashed #4a5568; border-radius: 0.5rem; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.2); }
        /* Toast notification animation */
        @keyframes slideIn { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .toast { animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- App Header / Navbar -->
    <header class="bg-gray-900 shadow-md p-4 flex justify-between items-center border-b border-gray-700 z-20">
        <h1 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-red-500 tracking-tighter">
            POKÉCLONE TCG
        </h1>
        <div id="auth-section" class="flex items-center space-x-4">
            <span id="user-info" class="hidden text-sm text-gray-300"></span>
            <button id="btn-login" class="bg-white text-gray-900 font-bold py-2 px-4 rounded shadow hover:bg-gray-200 transition">
                Google Login
            </button>
            <button id="btn-logout" class="hidden bg-red-600 text-white font-bold py-2 px-4 rounded shadow hover:bg-red-700 transition">
                Logout
            </button>
        </div>
    </header>

    <!-- Main Game Area (Hidden initially) -->
    <main id="game-board" class="hidden flex-1 flex flex-col relative w-full max-w-5xl mx-auto p-4">
        
        <!-- Opponent Area (Mock) -->
        <div class="h-32 border-b border-gray-700 flex justify-center items-center opacity-50">
            <p class="text-gray-500 tracking-widest font-semibold">OPPONENT AREA</p>
        </div>

        <!-- Play Area -->
        <div class="flex-1 flex flex-col py-6">
            
            <!-- Active Pokemon Slot -->
            <div class="flex justify-center mb-8">
                <div class="flex flex-col items-center">
                    <p class="text-xs text-gray-400 mb-1 font-bold">ACTIVE</p>
                    <div id="active-slot" class="slot w-32 h-44 relative" onclick="interactWithSlot('active')">
                        <!-- Active Card goes here -->
                    </div>
                </div>
            </div>

            <!-- Bench & Deck Area -->
            <div class="flex justify-between items-end w-full px-4">
                <!-- Bench Slots -->
                <div class="flex space-x-2">
                    <div class="flex flex-col items-center">
                        <p class="text-xs text-gray-400 mb-1 font-bold">BENCH</p>
                        <div class="flex space-x-2" id="bench-slots">
                            <!-- JS will populate bench slots here -->
                        </div>
                    </div>
                </div>

                <!-- Deck & Discard -->
                <div class="flex space-x-4">
                    <div class="flex flex-col items-center cursor-pointer" onclick="drawCard()">
                        <p class="text-xs text-gray-400 mb-1 font-bold">DECK (<span id="deck-count">0</span>)</p>
                        <div class="w-24 h-32 bg-blue-800 rounded-lg border-4 border-blue-600 shadow-lg flex items-center justify-center text-white font-bold hover:bg-blue-700 transition">
                            DRAW
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Player Hand -->
        <div class="mt-auto h-48 border-t border-gray-700 pt-4 flex flex-col justify-end">
            <p class="text-xs text-gray-400 text-center mb-2 font-bold">YOUR HAND</p>
            <div id="player-hand" class="hand-container px-4">
                <!-- Cards will be injected here -->
            </div>
        </div>
    </main>

    <!-- Login Prompt (Visible initially) -->
    <div id="login-prompt" class="flex-1 flex items-center justify-center">
        <div class="text-center bg-gray-800 p-8 rounded-xl shadow-2xl max-w-md w-full border border-gray-700">
            <h2 class="text-3xl font-bold mb-4">Welcome to PokéClone!</h2>
            <p class="text-gray-400 mb-8">Please login with your Google account to start playing and save your deck.</p>
            <p class="text-xs text-gray-500">Firebase Backend Integrated.</p>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <script type="module">
        // 1. Firebase Imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 2. Firebase Configuration (User provided)
        const firebaseConfig = {
            apiKey: "AIzaSyBEwJfxABiedxcpMUVZHEjh3hCoMi1ypoA",
            authDomain: "task-e184e.firebaseapp.com",
            projectId: "task-e184e",
            storageBucket: "task-e184e.firebasestorage.app",
            messagingSenderId: "978971119576",
            appId: "1:978971119576:web:81a93c0b081b2b47f22cad"
        };

        // 3. Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // 4. Game Data & State Management
        const CARD_DATABASE = [
            { id: 1, name: 'Pikachu', hp: 60, type: '⚡', attack: 'Thundershock', dmg: 20, bg: 'bg-yellow-400' },
            { id: 2, name: 'Charmander', hp: 50, type: '🔥', attack: 'Ember', dmg: 30, bg: 'bg-red-500' },
            { id: 3, name: 'Bulbasaur', hp: 70, type: '🍃', attack: 'Vine Whip', dmg: 20, bg: 'bg-green-500' },
            { id: 4, name: 'Squirtle', hp: 60, type: '💧', attack: 'Water Gun', dmg: 20, bg: 'bg-blue-400' },
            { id: 5, name: 'Jigglypuff', hp: 70, type: '⚪', attack: 'Sing', dmg: 10, bg: 'bg-pink-300' },
            { id: 6, name: 'Mewtwo', hp: 120, type: '🔮', attack: 'Psychic', dmg: 50, bg: 'bg-purple-500' },
        ];

        let gameState = {
            deck: [],
            hand: [],
            active: null,
            bench: [null, null, null, null, null], // Max 5 bench slots
            selectedHandCardIndex: null
        };

        let currentUser = null;

        // 5. DOM Elements
        const ui = {
            btnLogin: document.getElementById('btn-login'),
            btnLogout: document.getElementById('btn-logout'),
            userInfo: document.getElementById('user-info'),
            loginPrompt: document.getElementById('login-prompt'),
            gameBoard: document.getElementById('game-board'),
            playerHand: document.getElementById('player-hand'),
            deckCount: document.getElementById('deck-count'),
            activeSlot: document.getElementById('active-slot'),
            benchSlots: document.getElementById('bench-slots'),
            toastContainer: document.getElementById('toast-container')
        };

        // 6. Utility: Custom Toast Message (Replaces alert())
        window.showToast = function(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast px-4 py-3 rounded shadow-lg text-white font-semibold ${type === 'error' ? 'bg-red-500' : 'bg-gray-800 border border-gray-600'}`;
            toast.innerText = message;
            ui.toastContainer.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // 7. Auth Logic
        ui.btnLogin.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Login failed", error);
                showToast("Login failed. Check console.", "error");
            }
        });

        ui.btnLogout.addEventListener('click', () => {
            signOut(auth);
            showToast("Logged out successfully");
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                ui.userInfo.innerText = user.displayName;
                ui.userInfo.classList.remove('hidden');
                ui.btnLogout.classList.remove('hidden');
                ui.btnLogin.classList.add('hidden');
                
                ui.loginPrompt.classList.add('hidden');
                ui.gameBoard.classList.remove('hidden');
                
                await loadOrInitializeGameData();
            } else {
                currentUser = null;
                ui.userInfo.classList.add('hidden');
                ui.btnLogout.classList.add('hidden');
                ui.btnLogin.classList.remove('hidden');
                
                ui.loginPrompt.classList.remove('hidden');
                ui.gameBoard.classList.add('hidden');
            }
        });

        // 8. Firestore Data Handling
        async function loadOrInitializeGameData() {
            if (!currentUser) return;
            // RULE 1: STRICT PATHS FOR PRIVATE DATA
            const docRef = doc(db, 'artifacts', 'pokeclone', 'users', currentUser.uid, 'gamestate');
            
            try {
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    // Load existing state
                    gameState = docSnap.data();
                    showToast("Game saved state loaded!");
                } else {
                    // Initialize new game state
                    initNewGame();
                    await saveGameState();
                }
                renderGame();
            } catch (error) {
                console.error("Error loading data:", error);
                showToast("Failed to load game data.", "error");
            }
        }

        async function saveGameState() {
            if (!currentUser) return;
            const docRef = doc(db, 'artifacts', 'pokeclone', 'users', currentUser.uid, 'gamestate');
            try {
                await setDoc(docRef, gameState);
            } catch (error) {
                console.error("Error saving game:", error);
            }
        }

        // 9. Game Logic
        function initNewGame() {
            // Create a mock deck of 20 cards
            let newDeck = [];
            for (let i = 0; i < 20; i++) {
                const randomCard = CARD_DATABASE[Math.floor(Math.random() * CARD_DATABASE.length)];
                // Clone card object to avoid reference issues
                newDeck.push({ ...randomCard, instanceId: crypto.randomUUID() }); 
            }
            
            gameState.deck = newDeck;
            gameState.hand = [];
            gameState.active = null;
            gameState.bench = [null, null, null, null, null];
            
            // Initial draw
            for(let i=0; i<5; i++) drawCardLogic(false);
            showToast("New game started!");
        }

        window.drawCard = function() {
            drawCardLogic(true);
        }

        function drawCardLogic(shouldSaveAndRender = true) {
            if (gameState.deck.length === 0) {
                if(shouldSaveAndRender) showToast("Deck is empty!", "error");
                return;
            }
            if (gameState.hand.length >= 7) {
                if(shouldSaveAndRender) showToast("Hand is full (Max 7)!", "error");
                return;
            }
            
            const card = gameState.deck.pop();
            gameState.hand.push(card);
            
            if (shouldSaveAndRender) {
                renderGame();
                saveGameState();
            }
        }

        window.selectCardFromHand = function(index) {
            gameState.selectedHandCardIndex = gameState.selectedHandCardIndex === index ? null : index;
            renderGame();
        }

        window.interactWithSlot = function(slotType, benchIndex = null) {
            if (gameState.selectedHandCardIndex === null) return; // No card selected

            const selectedCard = gameState.hand[gameState.selectedHandCardIndex];

            if (slotType === 'active') {
                if (gameState.active !== null) {
                    showToast("Active slot is already full!", "error");
                    return;
                }
                gameState.active = selectedCard;
            } else if (slotType === 'bench') {
                if (gameState.bench[benchIndex] !== null) {
                     showToast("Bench slot is already full!", "error");
                     return;
                }
                gameState.bench[benchIndex] = selectedCard;
            }

            // Remove from hand
            gameState.hand.splice(gameState.selectedHandCardIndex, 1);
            gameState.selectedHandCardIndex = null;
            
            renderGame();
            saveGameState();
        }

        // 10. UI Rendering logic
        function createCardHTML(card, isSelected = false, onClickAction = "") {
            if (!card) return '';
            const borderClass = isSelected ? 'border-4 border-yellow-300 transform -translate-y-4' : 'border-4 border-gray-800';
            return `
                <div onclick="${onClickAction}" class="card w-32 h-44 rounded-xl shadow-lg flex flex-col p-2 select-none bg-gray-100 ${borderClass} relative overflow-hidden transition-all duration-200" style="min-width: 8rem;">
                    <!-- Top banner (Type and HP) -->
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-xs font-bold text-gray-800">${card.name}</span>
                        <span class="text-xs font-bold text-red-600">${card.hp} HP</span>
                    </div>
                    <!-- Image placeholder area -->
                    <div class="${card.bg} h-16 w-full rounded flex items-center justify-center text-3xl shadow-inner mb-2 border border-gray-400">
                        ${card.type}
                    </div>
                    <!-- Stats / Attacks -->
                    <div class="flex-1 flex flex-col justify-center text-gray-900 bg-white rounded p-1 shadow-sm text-xs">
                        <div class="flex justify-between items-center border-b border-gray-200 pb-1 mb-1">
                            <span class="font-bold text-gray-700">${card.attack}</span>
                            <span class="font-extrabold">${card.dmg}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderGame() {
            // Render Hand
            ui.playerHand.innerHTML = '';
            gameState.hand.forEach((card, index) => {
                const isSelected = gameState.selectedHandCardIndex === index;
                const wrapper = document.createElement('div');
                wrapper.className = 'hand-card cursor-pointer';
                wrapper.innerHTML = createCardHTML(card, isSelected, `selectCardFromHand(${index})`);
                ui.playerHand.appendChild(wrapper);
            });

            // Render Active
            ui.activeSlot.innerHTML = gameState.active 
                ? createCardHTML(gameState.active, false)
                : '<span class="text-gray-600 text-sm">Play a card here</span>';

            // Render Bench
            ui.benchSlots.innerHTML = '';
            gameState.bench.forEach((card, index) => {
                const slot = document.createElement('div');
                slot.className = 'slot w-20 h-28 cursor-pointer transform scale-90 -m-2 hover:scale-100 transition';
                slot.onclick = () => interactWithSlot('bench', index);
                
                if (card) {
                    slot.innerHTML = createCardHTML(card, false);
                    // Hide inner text by scaling it down to fit the small bench slot
                    slot.style.overflow = 'hidden';
                } else {
                    slot.innerHTML = `<span class="text-xs text-gray-600">Bench ${index+1}</span>`;
                }
                ui.benchSlots.appendChild(slot);
            });

            // Update Deck Count
            ui.deckCount.innerText = gameState.deck.length;
        }

    </script>
</body>
</html>
